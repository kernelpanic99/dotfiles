# --- Options -----------------------------------------------------------------
set -g prefix C-s
unbind C-b
bind C-s send-prefix

set -g mouse on
set -sg escape-time 10
set -g history-limit 50000
set -g default-terminal "tmux-256color"
setw -g mode-keys vi
set -g focus-events on

set -g status on
set -g status-position top
set -g renumber-windows on

set -sg terminal-overrides ",*:RGB"

# --- Keys -------------------------------------------------------------------
bind-key K kill-session

bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

bind -r n next-window
bind -r p previous-window

# --- vim-tmux-navigator (inline, no tpm) ---------------------------------
# tpm's scripts use `#!/usr/bin/env bash`, which Termux cannot resolve without
# termux-exec loaded, so plugins are inlined instead. Vim detection is a
# format-only regex on #{pane_current_command}: tmux tracks that natively, where
# the upstream plugin's `ps -o comm=` probe fails (Termux truncates comm).
is_vim="#{m/ri:^g?(view|n?vim?x?)(diff)?$,#{pane_current_command}}"

bind-key -n C-h if-shell -F "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell -F "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell -F "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell -F "$is_vim" 'send-keys C-l' 'select-pane -R'

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

# --- Copy to the Android clipboard -------------------------------------
bind-key -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel termux-clipboard-set
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel termux-clipboard-set
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel termux-clipboard-set

# --- Catppuccin Mocha status (inline) --------------------------------
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[bg=#cba6f7,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#cdd6f4] "
set -g status-left-length 30
set -g status-right "#[fg=#6c7086]#{host_short}  #[fg=#cba6f7]%H:%M "
set -g window-status-current-format "#[bg=#89b4fa,fg=#1e1e2e,bold] #I:#W "
set -g window-status-format "#[fg=#6c7086] #I:#W "
set -g pane-active-border-style "fg=#cba6f7"
set -g pane-border-style "fg=#313244"
